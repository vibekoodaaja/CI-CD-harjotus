name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-build:
    name: Lint, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: ruff check .

      - name: Run unit tests
        run: pytest -q

      - name: Create package artifact
        run: |
          mkdir -p dist
          python -m zipfile -c dist/demo-app.zip app.py requirements.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: demo-app-${{ github.sha }}
          path: dist/demo-app.zip
          if-no-files-found: error
          retention-days: 7
